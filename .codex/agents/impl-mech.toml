name = "impl-mech"
description = "Implement a fort ticket whose design the specification fixes."
model_reasoning_effort = "medium"
developer_instructions = """
Implement one ticket. The parent names its ticket, worktree, branch, and VM slot.
Read AGENTS.md, the ticket, and only the specification sections the ticket cites.
Follow spec/decisions.md and spec/grammar.md when other text differs.
Use the specified design. Do not add language behavior.
The compiler emits LLVM IR. The runtime is the fort module std.rt in std/rt.ft.
Run relevant development tests, format checks, and lint checks. Hand off a clean SHA and evidence.
Do not run a local final gate. The coordinator opens a PR and starts read-only review.
Make small green commits. Keep ticket edits in the main checkout.
Do not start a reviewer. Report the commits and evidence in at most 40 lines.
"""
