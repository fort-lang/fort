# The checks of the fort compiler: the format of its C test helpers, the fort lint, a
# Release bootstrap from bootstrap0 followed by the compiler tests, and the language server
# build with its tests.
#
# Every job checks out the full history. Configure reads the pinned commit of
# tools/bootstrap.ref with git, and a shallow clone does not hold it.
# The Linux target is x86_64-linux-gnu and the Darwin target is arm64, so each runner
# builds and runs its target natively.
name: fort

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: format (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: ubuntu-latest, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        run: tools/ci_setup.sh ${{ matrix.host }} lint
      - name: Configure
        run: cmake --preset release
      # fort has no formatter. This checks the C helpers under test/.
      - name: Check the format of the C test helpers
        run: cmake --build --preset release --target format-check

  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: ubuntu-latest, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        run: tools/ci_setup.sh ${{ matrix.host }}
      - name: Configure
        run: cmake --preset release
      # The lint reads `fort --index`, so the target bootstraps the compiler first. Each
      # host lints its own std/<target> modules.
      - name: Lint the fort sources
        run: cmake --build --preset release --target lint

  bootstrap:
    name: bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: ubuntu-latest, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        run: tools/ci_setup.sh ${{ matrix.host }}
      # The release preset is a Release build, so every stage of the chain gets --release.
      - name: Configure
        run: cmake --preset release
      # bootstrap0 builds bootstrap-1, which builds HEAD into build/<Host>/release/fort.
      # The targets are the default build without fort_lsp, which the job lsp builds, and
      # without the C unit suites, which bootstrap0.yml builds and runs.
      - name: Bootstrap the compiler
        run: >-
          cmake --build --preset release
          --target fort fort_std lang_ffi_helpers
      # The fort tests: the language corpus, the check mode, the fixpoint in four build
      # modes, the terminal test, and the module and FIR tests.
      - name: Run the fort tests
        run: |
          ulimit -c 0
          ctest --preset release -L '^fort$' --no-tests=error \
            -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Record the source audit build
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess

          build = Path("build") / platform.system() / "release"
          evidence = build / "ownership-source-evidence"
          evidence.mkdir()
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          digest = hashlib.sha256((build / "fort").read_bytes()).hexdigest()
          provenance = {"revision": revision, "sha256": digest}
          (evidence / "compiler-provenance.json").write_text(json.dumps(provenance) + "\n")
          context = {
              "pr_head": os.environ["PR_HEAD"],
              "tested_revision": os.environ["TESTED_REVISION"],
              "source_revision": revision,
              "compiler_revision": revision,
              "compiler_sha256": digest,
          }
          (evidence / "ci-context.json").write_text(json.dumps(context) + "\n")
          PY
      # Exit 1 ownership verdicts remain visible. Invalid reports fail this gate.
      - name: Audit actual compiler source reports
        run: |
          host="$(uname -s)"
          target=x86_64-linux-gnu
          if [ "$host" = Darwin ]; then target=arm64-apple-macosx11.0.0; fi
          build="build/$host/release"
          python3 tools/ownership_audit.py run \
            --checkout "$PWD" --compiler "$build/fort" \
            --compiler-checkout "$PWD" \
            --compiler-provenance "$build/ownership-source-evidence/compiler-provenance.json" \
            --target "$target" --std-dir "$build/std" \
            --output "$build/ownership-source-evidence/audit"
          python3 tools/ownership_audit.py validate \
            --checkout "$PWD" --compiler "$build/fort" \
            --compiler-checkout "$PWD" \
            --compiler-provenance "$build/ownership-source-evidence/compiler-provenance.json" \
            "$build/ownership-source-evidence/audit/audit.json"
      - name: Keep ownership source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ownership-source-${{ matrix.os }}
          path: build/*/release/ownership-source-evidence/
          if-no-files-found: ignore
      - name: Keep the fixpoint diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fixpoint-${{ matrix.os }}
          path: build/*/release/cmake-fixpoint/fixpoint/*/module.diff
          if-no-files-found: ignore

  # The language server: fort-lsp and its tests, apart from the compiler's.
  lsp:
    name: lsp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: ubuntu-latest, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        run: tools/ci_setup.sh ${{ matrix.host }}
      - name: Configure
        run: cmake --preset release
      # fort-lsp is src/lsp compiled by the product compiler, so the target bootstraps
      # the compiler first.
      - name: Build the language server
        run: cmake --build --preset release --target fort_lsp
      # The module tests of test/lsp and the test of the fort-lsp binary.
      - name: Run the language server tests
        run: |
          ulimit -c 0
          ctest --preset release -L '^lsp$' --no-tests=error \
            -j "$(getconf _NPROCESSORS_ONLN)"
