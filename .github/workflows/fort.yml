# The checks of the fort compiler: the format of its C test helpers, the fort lint, a
# Release bootstrap from bootstrap0 followed by the compiler tests, the module tests in
# parts, and the language server build with its tests.
#
# Every job checks out the full history. Configure reads the pinned commit of
# tools/bootstrap.ref with git, and a shallow clone does not hold it.
# The Linux target is x86_64-linux-gnu and the Darwin target is arm64, so each runner
# builds and runs its target natively.
name: fort

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: format (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        timeout-minutes: 14
        run: tools/ci_setup.sh ${{ matrix.host }} lint
      - name: Configure
        run: cmake --preset release
      # fort has no formatter. This checks the C helpers under test/.
      - name: Check the format of the C test helpers
        run: cmake --build --preset release --target format-check

  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        timeout-minutes: 14
        run: tools/ci_setup.sh ${{ matrix.host }}
      - name: Configure
        run: cmake --preset release
      # The lint reads `fort --index`, so the target bootstraps the compiler first. Each
      # host lints its own std/<target> modules.
      - name: Lint the fort sources
        run: cmake --build --preset release --target lint

  bootstrap:
    name: bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    # notes/environment.md 7 gives the measured job times behind this bound.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        timeout-minutes: 14
        run: tools/ci_setup.sh ${{ matrix.host }}
      # The release preset is a Release build, so every stage of the chain gets --release.
      - name: Configure
        run: cmake --preset release
      # bootstrap0 builds bootstrap-1, which builds HEAD into build/<Host>/release/fort.
      # The targets are the default build without fort_lsp, which the job lsp builds, and
      # without the C unit suites, which bootstrap0.yml builds and runs.
      - name: Bootstrap the compiler
        run: >-
          cmake --build --preset release
          --target fort fort_std lang_ffi_helpers
      # The fort tests: the language corpus, the check mode, the fixpoint in four build
      # modes, the terminal test, and the FIR tests. The parts of the module corpus carry
      # the label `modules`, and the job `modules` runs them.
      - name: Run the fort tests
        run: |
          ulimit -c 0
          ctest --preset release -L '^fort$' -LE '^modules$' --no-tests=error \
            -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Keep the fixpoint diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fixpoint-${{ matrix.os }}
          path: build/*/release/cmake-fixpoint/fixpoint/*/module.diff
          if-no-files-found: ignore

  # The module corpus test/fort: one part for each job. Each part takes all the
  # processors of its runner, so two runners halve the time of the corpus. The test
  # name holds the count of parts, so a count here that differs from
  # FORT_MODULE_SHARDS in CMakeLists.txt selects no test and fails the job.
  modules:
    name: modules (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        shard: [1, 2]
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    # notes/environment.md 7 gives the measured job times behind this bound.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        timeout-minutes: 14
        run: tools/ci_setup.sh ${{ matrix.host }}
      - name: Configure
        run: cmake --preset release
      - name: Bootstrap the compiler
        run: >-
          cmake --build --preset release
          --target fort fort_std
      - name: Run one part of the module tests
        run: |
          ulimit -c 0
          ctest --preset release -L '^modules$' \
            -R '^fort-modules-${{ matrix.shard }}-of-2$' --no-tests=error

  # The language server: fort-lsp and its tests, apart from the compiler's.
  lsp:
    name: lsp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux }
          - { os: macos-latest, host: darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the tools
        timeout-minutes: 14
        run: tools/ci_setup.sh ${{ matrix.host }}
      - name: Configure
        run: cmake --preset release
      # fort-lsp is src/lsp compiled by the product compiler, so the target bootstraps
      # the compiler first.
      - name: Build the language server
        run: cmake --build --preset release --target fort_lsp
      # The module tests of test/lsp and the test of the fort-lsp binary.
      - name: Run the language server tests
        run: |
          ulimit -c 0
          ctest --preset release -L '^lsp$' --no-tests=error \
            -j "$(getconf _NPROCESSORS_ONLN)"
